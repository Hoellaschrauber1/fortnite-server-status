<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortnite Server Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    .status {
      font-size: 1.5em;
      padding: 20px;
      margin: 20px auto;
      border-radius: 8px;
      display: inline-block;
      min-width: 300px;

transition: all 0.3s ease;
    }

    .operational {
      background-color: #28a745; /* Grün für Server Online */
      box-shadow: 0 0 15px #28a745;
    }

    .offline {
      background-color: #dc3545; /* Rot für Server Offline */
      box-shadow: 0 0 15px #dc3545;
    }

    .unknown {
      background-color: #6c757d; /* Grau für unbekannten Status */
      box-shadow: 0 0 15px #6c757d;
    }

    /* Animation für sanften Übergang */
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .status {
      animation: fadeIn 1s ease-out;
    }
  </style>
</head>
<body>

  <h1>Fortnite Server Status</h1>
  <div id="status" class="status unknown">Lade Status...</div>

  <script>
    async function ladeStatus() {
      try {
        const response = await fetch('https://status.epicgames.com/api/v2/summary.json'); // API von Epic Games
        const data = await response.json();
        const fortniteComponent = data.components.find(comp => comp.name === "Fortnite");

        const statusElement = document.getElementById('status');
        const status = fortniteComponent.status;

        switch (status) {
          case 'operational':
            statusElement.textContent = '✅ Server Online.';

statusElement.className = 'status operational';
            break;
          case 'degraded_performance':
            statusElement.textContent = '⚠ Fortnite hat Leistungsprobleme.';
            statusElement.className = 'status unknown';
            break;
          case 'partial_outage':
            statusElement.textContent = '🟠 Teilweiser Ausfall.';
            statusElement.className = 'status unknown';
            break;
          case 'major_outage':
            statusElement.textContent = '🔴 Server Offline!';
            statusElement.className = 'status offline';
            break;
          default:
            statusElement.textContent = '❓ Unbekannter Status.';
            statusElement.className = 'status unknown';
        }
      } catch (error) {
        const statusElement = document.getElementById('status');
        statusElement.textContent = '🚫 Fehler beim Laden.';
        statusElement.className = 'status offline';
        console.error(error);
      }
    }

    // Direkt beim Laden der Seite Status holen und alle 30 Sekunden neu laden
    ladeStatus();
    setInterval(ladeStatus, 30000); // alle 30 Sekunden aktualisieren
  </script>

</body>
</html>
